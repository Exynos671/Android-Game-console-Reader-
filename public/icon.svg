<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b18" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3" />

  <!-- Handheld Console Body -->
  <g transform="translate(46, 126)">
    <!-- Main Chassis -->
    <rect width="420" height="260" rx="48" fill="#18181b" stroke="#27272a" stroke-width="6" />
    
    <!-- Shoulder Buttons (LB / RB) -->
    <rect x="40" y="-12" width="80" height="16" rx="6" fill="#3f3f46" stroke="#52525b" stroke-width="2" />
    <rect x="300" y="-12" width="80" height="16" rx="6" fill="#3f3f46" stroke="#52525b" stroke-width="2" />

    <!-- Center Screen (Reading Display) -->
    <rect x="110" y="30" width="200" height="200" rx="16" fill="#090a0f" stroke="#3f3f46" stroke-width="3" />
    
    <!-- Open Book Graphic on Screen -->
    <path d="M150,85 Q180,75 210,88 L210,165 Q180,152 150,162 Z" fill="url(#amberGrad)" />
    <path d="M270,85 Q240,75 210,88 L210,165 Q240,152 270,162 Z" fill="#fef3c7" />
    <line x1="210" y1="88" x2="210" y2="165" stroke="#78350f" stroke-width="2" />
    
    <!-- Book lines -->
    <line x1="160" y1="105" x2="198" y2="100" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    <line x1="160" y1="120" x2="198" y2="115" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    <line x1="160" y1="135" x2="190" y2="130" stroke="#78350f" stroke-width="2" stroke-linecap="round" />

    <line x1="222" y1="100" x2="260" y2="105" stroke="#92400e" stroke-width="2" stroke-linecap="round" />
    <line x1="222" y1="115" x2="260" y2="120" stroke="#92400e" stroke-width="2" stroke-linecap="round" />
    <line x1="222" y1="130" x2="252" y2="135" stroke="#92400e" stroke-width="2" stroke-linecap="round" />

    <!-- Screen Status text -->
    <text x="210" y="195" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">PAGE 42</text>

    <!-- Left Controls (D-Pad & Analog Stick) -->
    <!-- D-Pad Cross -->
    <g transform="translate(52, 90)">
      <rect x="0" y="14" width="42" height="14" rx="3" fill="#27272a" />
      <rect x="14" y="0" width="14" height="42" rx="3" fill="#27272a" />
      <circle cx="21" cy="21" r="4" fill="#18181b" />
    </g>
    <!-- Left Thumbstick -->
    <circle cx="73" cy="185" r="18" fill="#27272a" stroke="#3f3f46" stroke-width="3" />
    <circle cx="73" cy="185" r="10" fill="#18181b" />

    <!-- Right Controls (ABXY & Right Stick) -->
    <!-- ABXY Buttons -->
    <g transform="translate(345, 105)">
      <!-- Y (Top) -->
      <circle cx="20" cy="0" r="9" fill="#f59e0b" />
      <text x="20" y="4" fill="#18181b" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle">Y</text>
      <!-- X (Left) -->
      <circle cx="0" cy="20" r="9" fill="#38bdf8" />
      <text x="0" y="24" fill="#18181b" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle">X</text>
      <!-- B (Right) -->
      <circle cx="40" cy="20" r="9" fill="#f43f5e" />
      <text x="40" y="24" fill="#18181b" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle">B</text>
      <!-- A (Bottom) -->
      <circle cx="20" cy="40" r="9" fill="#34d399" />
      <text x="20" y="44" fill="#18181b" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle">A</text>
    </g>
    <!-- Right Thumbstick -->
    <circle cx="365" cy="185" r="18" fill="#27272a" stroke="#3f3f46" stroke-width="3" />
    <circle cx="365" cy="185" r="10" fill="#18181b" />
  </g>
</svg>
